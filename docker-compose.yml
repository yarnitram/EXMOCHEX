services:
  # ----------------------------------------------------------------------------
  # 1. 24/7 Background Alert Watcher (Telegram, Discord, In-App Notifications)
  # ----------------------------------------------------------------------------
  watcher:
    build:
      context: .
      dockerfile: Dockerfile.watcher
    container_name: exmochex-watcher
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      - POLL_INTERVAL=2
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 2. Next.js Web Application (Staging Dashboard on port 3015)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://sup.ymatt.online}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    container_name: exmochex-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3015}:3015"
    environment:
      - PORT=3015
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://sup.ymatt.online}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
